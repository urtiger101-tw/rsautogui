[package]
name = "autogui-runtime"
version = "0.2.2"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = ["agent", "os", "opencv"]
agent = ["autogui-control-core/agent"]
os = ["autogui-control-core/os"]
opencv = ["autogui-control-core/opencv"]

[dependencies]
autogui = { path = ".." }
autogui-control-core = { path = "../crates/control", default-features = false }
serde_json = "1"
