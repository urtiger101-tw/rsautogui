[package]
name = "autogui-launcher"
version = "0.3.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "autogui-control"
path = "src/main.rs"

[dependencies]
autogui-protocol = { path = "../crates/protocol" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Globalization"] }
