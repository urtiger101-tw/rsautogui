[package]
name = "autogui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PyAutoGUI-compatible desktop automation in Rust"
readme = "README.md"
repository = "https://github.com/urtiger101-tw/rsautogui"

[workspace]
members = ["runtime", "launcher"]
resolver = "3"

[features]
default = ["locate", "os"]
agent = ["dep:serde", "dep:serde_json", "dep:base64"]
locate = []
opencv = ["dep:rustfft"]
os = ["dep:enigo"]

[dependencies]
enigo = { version = "0.6.1", optional = true }
image = { version = "0.25.10", default-features = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
thiserror = "2.0.18"
rustfft = { version = "6.4.1", optional = true }
xcap = "0.9.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_System_Console", "Win32_System_Power", "Win32_System_StationsAndDesktops", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_System_Console", "Win32_System_Power", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Controls"] }

[[example]]
name = "app_control"
test = true

[[example]]
name = "cheat_sheet"

[[example]]
name = "spiral_drag"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep unwinding: input guards and screensaver recovery rely on Drop.
panic = "unwind"

[profile.release.package.autogui]
opt-level = 3

[profile.release.package.rustfft]
opt-level = 3
